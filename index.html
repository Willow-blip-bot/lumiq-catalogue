<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LUMIQ · Interactive Catalogue</title>
<style>
:root{--paper:#fff8f1;--ink:#47483f;--ui:#f7f4ee;--line:#d8d5cc}*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:#ebe8e1;color:var(--ink);font:13px Arial,"Microsoft YaHei",sans-serif;overflow:hidden}button{font:inherit;color:inherit;cursor:pointer;border:0;background:transparent;border-radius:8px;padding:10px 14px}button:hover{background:#e3e0d8}button:disabled{opacity:.28;cursor:default}header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;background:#faf8f3;border-bottom:1px solid var(--line);position:relative;z-index:70}.brand{font-size:24px;letter-spacing:6px}.title{font-size:11px;letter-spacing:1.4px}.tools{display:flex;gap:5px}.stage{height:calc(100dvh - 134px);display:flex;align-items:center;justify-content:center;position:relative;background:radial-gradient(ellipse at center,#faf8f4 0,#e8e4dc 78%);overflow:hidden}.nav{position:absolute;top:47%;font-size:34px;padding:7px 13px;z-index:65;background:#fbf9f3d9;box-shadow:0 5px 18px #29261f13}.prev{left:2%}.next{right:2%}#mount{position:relative;filter:drop-shadow(0 14px 18px #302a2026);transition:transform .7s cubic-bezier(.2,.75,.2,1)}#mount.fan-open{transform:translateX(-25%) scale(.78)}#book{margin:auto}.paper{background:transparent;overflow:hidden}.page-content{position:relative;width:100%;height:100%;overflow:hidden}.page-content>img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;user-select:none;pointer-events:none}.gutter{position:absolute;top:20%;bottom:0;width:7%;pointer-events:none;z-index:5}.paper.--left .gutter{right:0;background:linear-gradient(to left,#493c2e24,transparent)}.paper.--right .gutter{left:0;background:linear-gradient(to right,#493c2e24,transparent)}.blank-arch{position:absolute;inset:0;background:#fff7ef;clip-path:path('M 0 595.276 L 0 209.764 A 209.764 209.764 0 0 1 419.528 209.764 L 419.528 595.276 Z')}.inside-cover{position:absolute;inset:0;background:#fff7ef;mask:url(assets/v3/cover-mask.svg) center/100% 100% no-repeat}.cover-page{mask:url(assets/v3/cover-mask.svg) center/100% 100% no-repeat}
/* The closed cover is a real layered object: holographic flyleaf below, die-cut cover above. */
.cover-scene{position:absolute;inset:0;z-index:55;perspective:1900px;cursor:pointer;transition:transform 1.15s cubic-bezier(.2,.75,.2,1);transform:translateX(-25%)}.cover-scene.opening{transform:translateX(0)}.cover-under,.cover-leaf{position:absolute;left:50%;top:0;width:50%;height:100%}.cover-under img,.cover-front img{width:100%;height:100%;display:block}.cover-leaf{transform-origin:left center;transform-style:preserve-3d;transition:transform 1.45s cubic-bezier(.22,.72,.14,1)}.cover-scene.opening .cover-leaf{transform:rotateY(-180deg)}.cover-face{position:absolute;inset:0;backface-visibility:hidden}.cover-front{mask:url(assets/v3/cover-mask.svg) center/100% 100% no-repeat;filter:drop-shadow(4px 7px 5px #2e221c33)}.cover-back{transform:rotateY(180deg);background:#fff7ef;mask:url(assets/v3/cover-mask.svg) center/100% 100% no-repeat;box-shadow:inset -18px 0 22px #47362913}
/* Product gatefold: it is attached to the right page and opens around its own fold line. */
.fan-rig{display:none;position:absolute;left:100%;top:0;width:50%;height:100%;z-index:58;perspective:1700px;pointer-events:none}.fan-rig.active{display:block}.fan-leaf{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;transition:transform 1.05s cubic-bezier(.2,.78,.2,1);pointer-events:auto;cursor:pointer;transform:rotateY(-180deg)}.fan-rig.open .fan-leaf{transform:rotateY(0)}.fan-face{position:absolute;inset:0;backface-visibility:hidden;filter:drop-shadow(2px 8px 6px #332a2230)}.fan-face img{width:100%;height:100%;display:block}.fan-back{transform:rotateY(180deg)}.fan-action{position:absolute;top:48%;z-index:3;white-space:nowrap;background:#fffdf8e8;border:1px solid #d8d1c7;border-radius:20px;padding:8px 12px;box-shadow:0 5px 16px #352b2220;pointer-events:auto}.fan-rig:not(.open) .fan-action{left:-44px;transform:translateX(-100%)}.fan-rig.open .fan-action{right:18px;top:8%}.fold-guide{position:absolute;left:-1px;top:30%;height:63%;border-left:1px dashed #a9958555;pointer-events:none}
.loading{position:absolute;inset:0;display:grid;place-items:center;background:#ece9e2;z-index:100}.loading.hidden{display:none}.bottom{height:70px;background:#faf8f3;display:flex;justify-content:space-between;align-items:center;padding:0 30px;gap:18px;border-top:1px solid var(--line)}.progress{display:flex;align-items:center;gap:14px}.progress input{width:min(31vw,380px);accent-color:#6e7662}.count{min-width:125px;font-size:12px}.hint{font-size:11px;color:#84847b}.overlay{display:none;position:fixed;inset:0;z-index:90;background:#f1eee8f7;overflow:auto;padding:82px 6% 42px}.overlay.show{display:block}.close{position:fixed;right:4%;top:18px;background:white;border:1px solid #ddd;border-radius:22px;z-index:95}.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:30px}.tile{padding:12px}.tile .spread{display:flex;align-items:flex-end;justify-content:center}.tile img{width:46%;height:auto}.tile span{display:block;margin-top:12px;font-size:11px}.tile em{font-style:normal;color:#9d7669}.zoomspread{display:flex;align-items:flex-end;justify-content:center;min-width:720px}.zoomspread img{height:125vh;width:auto}.zoomspread img.fanzoom{height:84vh}button:focus-visible{outline:2px solid #738067;outline-offset:3px}
@media(max-width:720px){header{height:60px;padding:0 12px}.title{display:none}.brand{font-size:19px}.tools{gap:0}.tools button{padding:9px 8px}.stage{height:calc(100dvh - 130px)}.bottom{padding:0 10px}.hint{display:none}.count{min-width:76px}.nav{font-size:25px;padding:5px}.prev{left:0}.next{right:0}.fan-action{font-size:10px;padding:6px 8px}.progress input{width:29vw}}@media(prefers-reduced-motion:reduce){#mount,.cover-scene,.cover-leaf,.fan-leaf{transition-duration:.01s}}
</style></head>
<body><header><span class="title">LUMIQ · FAMILY COLLECTION</span><nav class="tools"><button id="home">封面</button><button id="gridBtn">▦ 总览</button><button id="zoomBtn">＋ 放大</button><button id="fullBtn">⛶ 全屏</button></nav><span class="brand">LUMIQ</span></header>
<main class="stage" id="stage"><button class="nav prev" id="prev" aria-label="上一跨页">‹</button><div id="mount"><div id="book"></div><div id="fanRig" class="fan-rig"><div class="fold-guide"></div><div id="fanLeaf" class="fan-leaf" role="button" tabindex="0" aria-label="翻开小扇形联页"><div class="fan-face"><img id="fanFront" alt="产品规格联页正面"></div><div class="fan-face fan-back"><img id="fanBack" alt="产品规格联页背面"></div></div><button id="fanAction" class="fan-action">展开联页 →</button></div><div id="coverScene" class="cover-scene" role="button" tabindex="0" aria-label="翻开镂空封面，进入扉页"><div class="cover-under"><img src="assets/v3/p03.png" alt="彩色扉页"></div><div class="cover-leaf"><div class="cover-face cover-front"><img src="assets/v3/p01.png" alt="LUMIQ 镂空封面"></div><div class="cover-face cover-back"></div></div></div></div><button class="nav next" id="next" aria-label="下一跨页">›</button><div id="loading" class="loading">正在装订 V2 手册…</div></main>
<footer class="bottom"><span id="count" class="count">封面</span><div class="progress"><button id="first">|‹</button><input id="slider" type="range" min="0" max="11" value="0" aria-label="跳转跨页"><button id="last">›|</button></div><span id="hint" class="hint">点击封面，查看镂空层与扉页的叠合</span></footer>
<section class="overlay" id="grid"><button class="close" id="closeGrid">关闭 ×</button><div id="tiles" class="tiles"></div></section><section class="overlay" id="zoom"><button class="close" id="closeZoom">关闭 ×</button><div id="zoomContent" class="zoomspread"></div></section>
<script src="vendor/page-flip.js"></script><script>
const $=id=>document.getElementById(id), A=n=>`assets/v3/${n}`;
const pages=[
 {src:'p01.png',label:'封面',hard:1,mask:1},{inside:1,label:'封面内侧'}, {src:'p03.png',label:'彩色扉页'},
 {src:'p04.png',label:'扉页背面'},{src:'p05.png',label:'品牌故事'}, {src:'p06.png',label:'四大支柱'},{src:'p07.png',label:'战略定位'},
 {blank:1,label:'章节留白'},{src:'p08.png',label:'产品家族'},
 {src:'tablet-hero.png',label:'LumiqTablet'},{src:'tablet-features.png',label:'Tablet Features',fan:'tablet'},
 {src:'ola-hero.png',label:'LUMIQ OLA'},{src:'ola-features.png',label:'OLA Features',fan:'ola'},
 {src:'olago-hero.png',label:'OlaGo'},{src:'olago-features.png',label:'OlaGo Features',fan:'olago'},
 {src:'lf01-hero.png',label:'LumiqOrb'},{src:'lf01-features.png',label:'Orb Features',fan:'lf01'},
 {src:'band-hero.png',label:'LUMIQ Band'},{src:'p14.png',label:'Band Features'},
 {src:'p15.png',label:'LUMIQ PRINT'},{src:'p16.png',label:'品牌结页'},
 {blank:1,label:'封底内侧'},{src:'p02.png',label:'封底',hard:1}
];
const productFans={tablet:['tablet-fan-front.png','tablet-fan-back.png'],ola:['ola-fan-front.png','ola-fan-back.png'],olago:['olago-fan-front.png','olago-fan-back.png'],lf01:['lf01-fan-front.png','lf01-fan-back.png']};
const book=$('book');pages.forEach((p,i)=>{const e=document.createElement('div');e.className='paper';e.dataset.index=i;e.dataset.density=p.hard?'hard':'soft';let body=p.inside?'<div class="inside-cover"></div>':p.blank?'<div class="blank-arch"></div>':`<img class="${p.mask?'cover-page':''}" src="${A(p.src)}" alt="${p.label}">`;e.innerHTML=`<div class="page-content">${body}<span class="gutter"></span></div>`;book.append(e)});
let pf,closed=true,opening=false,turning=false,fanOpen=false,fanKey=null;
function pageSize(){const s=$('stage');let h=Math.min(s.clientHeight-42,(s.clientWidth-110)*595.276/839.056,820);h=Math.max(190,h);return{h,w:h*419.528/595.276}}
function resize(){const{h,w}=pageSize();$('mount').style.width=w*2+'px';$('mount').style.height=h+'px';if(pf)pf.update()}
resize();let sz=pageSize();pf=new St.PageFlip(book,{width:sz.w,height:sz.h,size:'stretch',minWidth:95,maxWidth:600,minHeight:135,maxHeight:850,showCover:true,usePortrait:false,autoSize:true,drawShadow:true,maxShadowOpacity:.28,flippingTime:1250,useMouseEvents:true,mobileScrollSupport:false,showPageCorners:true,disableFlipByClick:false});
pf.loadFromHTML(document.querySelectorAll('.paper'));book.style.visibility='hidden';
function spreadLeft(){let n=pf.getCurrentPageIndex();if(n<=0)return 0;if(n>=pages.length-1)return pages.length-1;return n%2?n:n-1}
function visible(){if(closed)return[0];let l=spreadLeft();return l===pages.length-1?[l]:[l,l+1].filter(i=>i<pages.length)}
function closeFan(immediate=false){fanOpen=false;$('fanRig').classList.remove('open');$('mount').classList.remove('fan-open');$('fanAction').textContent='展开联页 →';if(immediate){$('fanLeaf').style.transition='none';requestAnimationFrame(()=>requestAnimationFrame(()=>$('fanLeaf').style.transition=''))}}
function syncFan(){const ids=visible(),key=ids.map(i=>pages[i]?.fan).find(Boolean);if(!key){fanKey=null;$('fanRig').classList.remove('active');closeFan(true);return}if(fanKey!==key){closeFan(true);fanKey=key;$('fanFront').src=A(productFans[key][0]);$('fanBack').src=A(productFans[key][1])}$('fanRig').classList.add('active')}
function toggleFan(){if(!fanKey||turning)return;fanOpen=!fanOpen;$('fanRig').classList.toggle('open',fanOpen);$('mount').classList.toggle('fan-open',fanOpen);$('fanAction').textContent=fanOpen?'← 合上联页':'展开联页 →';syncText()}
function spreadNo(){let l=spreadLeft();return l<=0?0:Math.floor((l+1)/2)}
function syncText(){const ids=visible();if(closed){$('count').textContent='封面';$('slider').value=0;$('hint').textContent='点击封面，查看镂空层与扉页的叠合'}else{$('count').textContent=ids.length===1?'封底':`${String(ids[0]).padStart(2,'0')} – ${String(ids[1]).padStart(2,'0')} / ${pages.length-1}`;$('slider').value=Math.min(11,spreadNo());$('hint').textContent=fanKey?(fanOpen?'小扇形联页已沿折线展开，点击可合回':'点击右页边缘的小扇形联页，沿折线展开'):'拖动右下角翻页，左右页面始终连接'}$('prev').disabled=closed;$('next').disabled=!closed&&pf.getCurrentPageIndex()>=pages.length-1;}
function sync(){syncFan();syncText()}
pf.on('changeState',e=>{turning=e.data!=='read';if(turning)$('fanRig').classList.remove('active')});pf.on('flip',()=>{if(!closed){sync();}if(pf.getCurrentPageIndex()===0&&!opening){closed=true;book.style.visibility='hidden';$('coverScene').style.display='block';$('coverScene').classList.remove('opening');sync()}});
function openCover(){if(!closed||opening)return;opening=true;pf.turnToPage(1);book.style.visibility='hidden';$('coverScene').classList.add('opening');setTimeout(()=>{closed=false;opening=false;book.style.visibility='visible';$('coverScene').style.display='none';sync()},matchMedia('(prefers-reduced-motion:reduce)').matches?60:1500)}
function home(){if(opening||turning)return;closeFan(true);closed=true;pf.turnToPage(0);book.style.visibility='hidden';$('coverScene').style.display='block';$('coverScene').classList.remove('opening');sync()}
function next(){if(closed)return openCover();if(turning)return;if(fanOpen){closeFan();syncText();return}pf.flipNext('bottom')}
function prev(){if(closed||turning||opening)return;if(fanOpen){closeFan();syncText();return}if(spreadLeft()<=1){opening=true;$('coverScene').style.display='block';$('coverScene').classList.add('opening');book.style.visibility='hidden';requestAnimationFrame(()=>requestAnimationFrame(()=>$('coverScene').classList.remove('opening')));setTimeout(()=>{opening=false;closed=true;pf.turnToPage(0);sync()},1450)}else pf.flipPrev('bottom')}
function jump(i){if(opening)return;closeFan(true);if(i===0)return home();closed=false;$('coverScene').style.display='none';book.style.visibility='visible';pf.turnToPage(Math.min(pages.length-1,i));setTimeout(sync,30)}
$('coverScene').onclick=openCover;$('coverScene').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openCover()}};$('fanLeaf').onclick=toggleFan;$('fanAction').onclick=toggleFan;$('fanLeaf').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleFan()}};$('next').onclick=next;$('prev').onclick=prev;$('home').onclick=home;$('first').onclick=home;$('last').onclick=()=>jump(pages.length-1);$('slider').onchange=e=>{let v=+e.target.value;jump(v===0?0:Math.min(pages.length-1,v*2-1))};
$('gridBtn').onclick=()=>$('grid').classList.add('show');$('closeGrid').onclick=()=>$('grid').classList.remove('show');for(let l=1;l<pages.length;l+=2){const ids=[l,l+1].filter(i=>i<pages.length),t=document.createElement('button');t.className='tile';t.innerHTML=`<div class="spread">${ids.map(i=>pages[i].blank||pages[i].inside?'<span style="width:46%;aspect-ratio:419.528/595.276;background:#fff7ef;border-radius:50% 50% 0 0"></span>':`<img loading="lazy" src="${A(pages[i].src)}" alt="${pages[i].label}">`).join('')}</div><span>${ids.map(i=>pages[i].label).join(' · ')} ${ids.some(i=>pages[i].fan)?'<em>＋ 小扇形联页</em>':''}</span>`;t.onclick=()=>{jump(l);$('grid').classList.remove('show')};$('tiles').append(t)}
$('zoomBtn').onclick=()=>{$('zoomContent').innerHTML=visible().map(i=>pages[i].blank||pages[i].inside?'':`<img src="${A(pages[i].src)}" alt="${pages[i].label}">`).join('')+(fanKey&&fanOpen?`<img class="fanzoom" src="${A(productFans[fanKey][0])}" alt="展开的联页">`:'');$('zoom').classList.add('show')};$('closeZoom').onclick=()=>$('zoom').classList.remove('show');$('fullBtn').onclick=async()=>{try{document.fullscreenElement?await document.exitFullscreen():await document.documentElement.requestFullscreen()}catch{$('zoomBtn').click()}};document.onkeydown=e=>{if(e.key==='Escape')document.querySelectorAll('.overlay').forEach(x=>x.classList.remove('show'));if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev();if((e.key==='Enter'||e.key===' ')&&fanKey&&!closed)toggleFan()};window.addEventListener('resize',resize);
Promise.all(['p01.png','p03.png','p04.png'].map(n=>new Promise(r=>{const i=new Image;i.onload=i.onerror=r;i.src=A(n)}))).then(()=>$('loading').classList.add('hidden'));setTimeout(()=>$('loading').classList.add('hidden'),4500);sync();
</script></body></html>
